version: "3.8"

networks:
  vpc-net:
    driver: bridge

services:
  couchdb:
    image: couchdb:3.5
    container_name: obsync-couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-changeme}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@localhost:5984/_up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vpc-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: obsync-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - vpc-net

volumes:
  couchdb_data:
  couchdb_config:
